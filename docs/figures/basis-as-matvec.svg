<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" width="900" role="img" aria-label="기저 2 4 1 과 lane 5 에 대해 A x = y 를 행렬로 적고, 고른 열을 XOR 하는 열 관점과 행마다 AND 후 XOR 하는 행 관점이 같은 계산임을 보인 그림"><rect x="0" y="0" width="900" height="402" fill="#FBFAF8"/><text x="40" y="32" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">같은 계산의 행렬곱 버전</text><text x="40" y="54" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">기저 [2, 4, 1] · lane 5.   행 i = 출력 비트, 열 j = 입력 비트, A[i][j] = bases[j] 의 비트 i.</text><text x="60" y="100" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#182230" text-anchor="start" font-weight="600">① A · x = y</text><text x="113.0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#B8651A" text-anchor="middle" font-weight="600">j0</text><text x="147.0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">j1</text><text x="181.0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#B8651A" text-anchor="middle" font-weight="600">j2</text><text x="88" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="end" font-weight="400">i0</text><rect x="96" y="120" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="113.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><rect x="130" y="120" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="147.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, mono