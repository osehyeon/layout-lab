eight="600">1</text><rect x="300" y="188" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="317.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><text x="317.0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2F7A55" text-anchor="middle" font-weight="600">y</text><text x="60" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">lane 5 = 101  →  비트 0, 2  →  y = 011 = 3</text><text x="430" y="100" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#B8651A" text-anchor="start" font-weight="600">② 열 관점 — 고른 열을 XOR</text><text x="447.0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B8651A" text-anchor="middle" font-weight="600">0열</text><rect x="430" y="120" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="447.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><rect x="430" y="154" width="34" height="34" fill="#F7EADC" stroke="#C9CDD4" stroke-width="0.9"/><text x="447.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B8651A" text-anchor="middle" font-weight="600">1</text><rect x="430" y="188" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="447.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><text x="447.0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#B8651A" text-anchor="middle" font-weight="600">= 2</text><text x="527.0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B8651A" text-anchor="middle" font-weight="600">2열</text><rect x="510" y="120" width="34" height="34" fill="#F7EADC" stroke="#C9CDD4" stroke-width="0.9"/><text x="527.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B8651A" text-anchor="middle" font-weight="600">1</text><rect x="510" y="154" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="527.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><rect x="510" y="188" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="527.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><text x="527.0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#B8651A" text-anchor="middle" font-weight="600">= 1</text><text x="482" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5D6875" text-anchor="middle" font-weight="600">^</text><text x="562" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5D6875" text-anchor="middle" font-weight="600">=</text><rect x="586" y="120" width="34" height="34" fill="#E4F0E9" stroke="#C9CDD4" stroke-width="0.9"/><text x="603.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#2F7A55" text-anchor="middle" font-weight="600">1</text><rect x="586" y="154" width="34" height="34" fill="#E4F0E9" stroke="#C9CDD4" stroke-width="0.9"/><text x="603.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#2F7A55" text-anchor="middle" font-weight="600">1</text><rect x="586" y="188" width="34" height="34" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="603.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B9BEC5" text-anchor="middle" font-weight="400">0</text><text x="603.0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2F7A55" text-anchor="middle" font-weight="600">= 3</text><text x="430" y="266" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#182230" text-anchor="start" font-weight="600">이것이 “켜진 비트의 기저값을 XOR” 이다.</text><text x="430" y="284" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">Ax 는 원래 열들의 선형결합이고,</text><text x="430" y="300" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">계수가 0/1 이라 “고른 열을 XOR” 이 된다.</text><text x="690" y="100" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#3B4FB8" text-anchor="start" font-weight="600">③ 행 관점</text><text x="690" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#3B4FB8" text-anchor="start" font-weight="600">yᵢ = XORⱼ ( A[i][j] AND xⱼ )</text><text x="690" y="150" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">곱이 AND, 합이 XOR.</text><text x="690" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">i=0 행:  0 0 1</text><text x="690" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">x    :  1 0 1</text><text x="690" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2F7A55" text-anchor="start" font-weight="400">AND  :  0 0 1  → XOR = 1</text><text x="690" y="238" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#182230" text-anchor="start" font-weight="600">셋을 모으면 y = 011 = 3.</text><rect x="40" y="324" width="820" height="60" fill="#FFFFFF" stroke="#C9CDD4"/><text x="60" y="348" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#182230" text-anchor="start" font-weight="600">② 와 ③ 은 같은 계산을 다르게 읽은 것이다. 앞 그림의 “고르는 기저” 칩이 곧 ② 의 고른 열이다.</text><text x="60" y="370" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">GPU 로 나가는 코드는 둘 중 어느 쪽도 아니다 — 행렬을 대각선으로 잘라 AND + 시프트로 묶는다.</text></svg>