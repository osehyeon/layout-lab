<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" role="img" aria-label="stride 배치는 행 비트와 열 비트가 각자 자기 출력 비트로만 가는 평행 배선이고, 스위즐은 행 비트 하나가 열 자리 출력 비트로 추가로 넘어와 그 자리가 두 입력의 XOR이 되는 구조임을 비교한 그림"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6875"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B03A3A"/></marker></defs><rect x="0" y="0" width="900" height="486" fill="#FBFAF8"/><text x="40" y="34" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">스위즐의 정의 — 한 축의 좌표가 다른 축의 비트를 뒤집는 것</text><text x="40" y="58" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" fill="#182230" text-anchor="start" font-weight="600">① stride 배치</text><text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">offset = row × 8 + col</text><text x="152" y="106" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#3B4FB8" text-anchor="middle" font-weight="600">행 2비트</text><text x="302.0" y="106" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#B8651A" text-anchor="middle" font-weight="600">열 3비트</text><text x="82" y="148" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="end" font-weight="600">입력</text><rect x="92" y="120" width="60" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.5"/><text x="122.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">r1</text><rect x="152" y="120" width="60" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.5"/><text x="182.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">r0</text><rect x="212" y="120" width="60" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.5"/><text x="242.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">c2</text><rect x="272" y="120" width="60" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.5"/><text x="302.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">c1</text><rect x="332" y="120" width="60" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.5"/><text x="362.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">c0</text><text x="82" y="352" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="end" font-weight="600">출력</text><rect x="92" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="122.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o4</text><rect x="152" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="182.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o3</text><rect x="212" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="242.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o2</text><rect x="272" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="302.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o1</text><rect x="332" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="362.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o0</text><path d="M122.0,164 C122.0,234 122.0,254 122.0,320" fill="none" stroke="#3B4FB8" stroke-width="1.6" marker-end="url(#m)"/><path d="M182.0,164 C182.0,234 182.0,254 182.0,320" fill="none" stroke="#3B4FB8" stroke-width="1.6" marker-end="url(#m)"/><path d="M242.0,164 C242.0,234 242.0,254 242.0,320" fill="none" stroke="#B8651A" stroke-width="1.6" marker-end="url(#m)"/><path d="M302.0,164 C302.0,234 302.0,254 302.0,320" fill="none" stroke="#B8651A" stroke-width="1.6" marker-end="url(#m)"/><path d="M362.0,164 C362.0,234 362.0,254 362.0,320" fill="none" stroke="#B8651A" stroke-width="1.6" marker-end="url(#m)"/><text x="40" y="424" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5D6875" text-anchor="start" font-weight="600">각 입력 비트가 자기 출력 비트로만 간다.</text><text x="40" y="446" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#182230" text-anchor="start" font-weight="400">행은 행 자리, 열은 열 자리 — 축이 안 섞인다.</text><text x="478" y="58" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" fill="#182230" text-anchor="start" font-weight="600">② 스위즐</text><text x="478" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">offset = row × 8 + ( col ^ (row × 4) )</text><text x="590" y="106" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#3B4FB8" text-anchor="middle" font-weight="600">행 2비트</text><text x="740.0" y="106" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#B8651A" text-anchor="middle" font-weight="600">열 3비트</text><text x="520" y="148" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="end" font-weight="600">입력</text><rect x="530" y="120" width="60" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.5"/><text x="560.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">r1</text><rect x="590" y="120" width="60" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.5"/><text x="620.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">r0</text><rect x="650" y="120" width="60" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.5"/><text x="680.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">c2</text><rect x="710" y="120" width="60" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.5"/><text x="740.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">c1</text><rect x="770" y="120" width="60" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.5"/><text x="800.0" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">c0</text><text x="520" y="352" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="end" font-weight="600">출력</text><rect x="530" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="560.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o4</text><rect x="590" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="620.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o3</text><rect x="650" y="324" width="60" height="44" fill="#FFFFFF" stroke="#B03A3A" stroke-width="2.2"/><text x="680.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B03A3A" text-anchor="middle" font-weight="600">o2</text><rect x="710" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="740.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o1</text><rect x="770" y="324" width="60" height="44" fill="#FFFFFF" stroke="#5D6875" stroke-width="1.2"/><text x="800.0" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5D6875" text-anchor="middle" font-weight="600">o0</text><path d="M560.0,164 C560.0,234 560.0,254 560.0,320" fill="none" stroke="#3B4FB8" stroke-width="1.6" marker-end="url(#m)"/><path d="M620.0,164 C620.0,234 620.0,254 620.0,320" fill="none" stroke="#3B4FB8" stroke-width="1.6" marker-end="url(#m)"/><path d="M680.0,164 C680.0,234 680.0,254 680.0,320" fill="none" stroke="#B8651A" stroke-width="1.6" marker-end="url(#m)"/><path d="M740.0,164 C740.0,234 740.0,254 740.0,320" fill="none" stroke="#B8651A" stroke-width="1.6" marker-end="url(#m)"/><path d="M800.0,164 C800.0,234 800.0,254 800.0,320" fill="none" stroke="#B8651A" stroke-width="1.6" marker-end="url(#m)"/><path d="M620.0,164 C620.0,234 680.0,254 680.0,320" fill="none" stroke="#B03A3A" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#mr)"/><text x="680.0" y="388" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#B03A3A" text-anchor="middle" font-weight="600">두 곳에서 온다</text><text x="478" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B03A3A" text-anchor="start" font-weight="600">o2 = c2 ^ r0  — 축이 섞였다.</text><text x="478" y="446" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#182230" text-anchor="start" font-weight="400">어떤 stride 로도 이 점선을 그릴 수 없다.</text><line x1="452" y1="48" x2="452" y2="456" stroke="#C9CDD4"/></svg>