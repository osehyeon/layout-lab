<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" role="img" aria-label="8원소 배열을 2행4열로 접고 전치해 4행2열로 만든 뒤 행 우선으로 다시 펴면 0 4 1 5 2 6 3 7 순서가 나오는 과정을 단계별로 보인 그림"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6875"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7A55"/></marker></defs><rect x="0" y="0" width="900" height="592" fill="#FBFAF8"/><text x="40" y="32" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">(2,4) → transpose → (4,2) → reshape (8,)  —  중간 단계까지</text><text x="40" y="54" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">색 = 값이 원래 앞 절반(0–3)인지 뒤 절반(4–7)인지. 값 자체는 끝까지 안 바뀐다.</text><text x="40" y="100" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#182230" text-anchor="start" font-weight="600">① 원본  (8,)</text><rect x="200" y="84" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="228.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="256" y="84" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="284.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="312" y="84" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="340.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><rect x="368" y="84" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="396.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">3</text><rect x="424" y="84" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="452.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">4</text><rect x="480" y="84" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="508.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">5</text><rect x="536" y="84" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="564.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">6</text><rect x="592" y="84" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="620.0" y="112.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">7</text><path d="M424,134 L424,166" stroke="#5D6875" stroke-width="1.6" marker-end="url(#m)"/><text x="436" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">reshape (2,4)  — 행 우선으로 접는다</text><text x="40" y="196" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#182230" text-anchor="start" font-weight="600">② (2,4)</text><rect x="200" y="180" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="228.0" y="208.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="256" y="180" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="284.0" y="208.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="312" y="180" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="340.0" y="208.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><rect x="368" y="180" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="396.0" y="208.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">3</text><rect x="200" y="226" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="228.0" y="254.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">4</text><rect x="256" y="226" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="284.0" y="254.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">5</text><rect x="312" y="226" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="340.0" y="254.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">6</text><rect x="368" y="226" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="396.0" y="254.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">7</text><text x="200" y="294" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">행마다 한 색 — 0–3 이 윗줄, 4–7 이 아랫줄</text><path d="M436,226 L560,226" stroke="#5D6875" stroke-width="1.8" marker-end="url(#m)"/><text x="498" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5D6875" text-anchor="middle" font-weight="400">transpose</text><text x="596" y="196" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#182230" text-anchor="start" font-weight="600">③ (4,2)</text><rect x="700" y="180" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="728.0" y="208.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="756" y="180" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="784.0" y="208.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">4</text><rect x="700" y="226" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="728.0" y="254.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="756" y="226" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="784.0" y="254.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">5</text><rect x="700" y="272" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="728.0" y="300.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><rect x="756" y="272" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="784.0" y="300.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">6</text><rect x="700" y="318" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="728.0" y="346.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">3</text><rect x="756" y="318" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="784.0" y="346.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">7</text><text x="596" y="222" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">열마다</text><text x="596" y="238" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">한 색</text><path d="M728.0,203.0 L784.0,203.0 L728.0,249.0 L784.0,249.0 L728.0,295.0 L784.0,295.0 L728.0,341.0 L784.0,341.0" fill="none" stroke="#2F7A55" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#mg)"/><text x="700" y="382" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#2F7A55" text-anchor="start" font-weight="600">초록 = 행 우선으로 읽는 순서</text><path d="M756,398 L756,430" stroke="#5D6875" stroke-width="1.6" marker-end="url(#m)"/><text x="744" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5D6875" text-anchor="end" font-weight="400">reshape (8,)  — 그 순서대로 펴면</text><text x="40" y="466" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#182230" text-anchor="start" font-weight="600">④ 결과  (8,)</text><rect x="200" y="450" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="228.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="256" y="450" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="284.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">4</text><rect x="312" y="450" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="340.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="368" y="450" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="396.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">5</text><rect x="424" y="450" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="452.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><rect x="480" y="450" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="508.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">6</text><rect x="536" y="450" width="56" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.4"/><text x="564.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">3</text><rect x="592" y="450" width="56" height="46" fill="#F7EADC" stroke="#B8651A" stroke-width="1.4"/><text x="620.0" y="478.76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="600">7</text><text x="200" y="516" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#182230" text-anchor="start" font-weight="400">색이 하나씩 번갈아 나온다 — (4,2) 를 가로로 읽었으니 앞·뒤 절반이 섞인다</text><rect x="40" y="534" width="820" height="44" fill="#FFFFFF" stroke="#C9CDD4"/><text x="60" y="562" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#182230" text-anchor="start" font-weight="600">transpose 는 값을 안 옮긴다. 마지막 reshape 가 “행 우선으로 다시 번호를 매겨라” 라고 요구하면서 순서가 바뀐다.</text></svg>