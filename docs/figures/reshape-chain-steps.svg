<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" width="900" role="img" aria-label="입력 비트 j 가 0 1 2 인 원소 1 2 4 를 색으로 따라가 최종 자리 2 4 1 을 읽어 기저 2 4 1 을 얻는 그림"><rect x="0" y="0" width="900" height="324" fill="#FBFAF8"/><defs><marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#182230"/></marker></defs><text x="40" y="30" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#182230" text-anchor="start" font-weight="600">1회차 — reshape → transpose → reshape 의 중간 단계</text><text x="40" y="52" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">숫자는 하나도 바뀌지 않는다. 바뀌는 것은 '몇 번째로 읽히는가' 뿐이다.</text><text x="40" y="74" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="600">색 = 입력 비트 j.  기저는 이 순서대로 적는다 →</text><rect x="290" y="63" width="116" height="15" rx="3" fill="#FDEBD8" stroke="#B8651A" stroke-width="1"/><text x="348" y="74.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#B8651A" text-anchor="middle" font-weight="600">j=0  ·  원소 1 = 2^0</text><text x="408" y="74.5" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">→</text><rect x="416" y="63" width="116" height="15" rx="3" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1"/><text x="474" y="74.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#3B4FB8" text-anchor="middle" font-weight="600">j=1  ·  원소 2 = 2^1</text><text x="534" y="74.5" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">→</text><rect x="542" y="63" width="116" height="15" rx="3" fill="#DDF0EC" stroke="#1F7A6C" stroke-width="1"/><text x="600" y="74.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#1F7A6C" text-anchor="middle" font-weight="600">j=2  ·  원소 4 = 2^2</text><text x="34" y="108" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#182230" text-anchor="start" font-weight="600">① 평평한 8칸</text><text x="34" y="124" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#5D6875" text-anchor="start" font-weight="400">들어오는 배열</text><rect x="34" y="181.0" width="23" height="26" rx="2" fill="#FFFFFF" stroke="#D5CFC4" stroke-width="1"/><text x="45.5" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="middle" font-weight="400">0</text><rect x="57" y="181.0" width="23" height="26" rx="2" fill="#FDEBD8" stroke="#B8651A" stroke-width="1.6"/><text x="68.5" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#B8651A" text-anchor="middle" font-weight="600">1</text><text x="68.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#B8651A" text-anchor="middle" font-weight="600">j=0</text><rect x="80" y="181.0" width="23" height="26" rx="2" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="91.5" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><text x="91.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#3B4FB8" text-anchor="middle" font-weight="600">j=1</text><rect x="103" y="181.0" width="23" height="26" rx="2" fill="#FFFFFF" stroke="#D5CFC4" stroke-width="1"/><text x="114.5" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, 