<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" role="img" aria-label="lane 에서 원소로 가는 전체 대응표에서 비트가 하나만 켜진 lane 1 2 4 의 값만 읽으면 기저 2 4 1 이 나오고 나머지 lane 은 그 XOR 로 계산된다는 것을 보이는 그림"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6875"/></marker></defs><rect x="0" y="0" width="900" height="548" fill="#FBFAF8"/><text x="40" y="34" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">표에서 기저를 뽑아내는 법</text><text x="40" y="56" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">8원소 예의 결과 — lane L 이 원소 OWN[L] 을 든다. 여기서 기저를 어떻게 얻는가.</text><text x="60" y="90" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#182230" text-anchor="start" font-weight="600">① 전체 대응표</text><text x="100" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="middle" font-weight="400">lane</text><text x="180" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="middle" font-weight="400">이진</text><text x="270" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="middle" font-weight="400">원소</text><rect x="70" y="116" width="230" height="36" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="100" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">0</text><text x="180" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A8AEB6" text-anchor="middle" font-weight="400">000</text><text x="270" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">0</text><rect x="70" y="152" width="230" height="36" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="100" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><text x="180" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3B4FB8" text-anchor="middle" font-weight="400">001</text><text x="270" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><rect x="70" y="188" width="230" height="36" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="100" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="middle" font-weight="600">2</text><text x="180" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3B4FB8" text-anchor="middle" font-weight="400">010</text><text x="270" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="middle" font-weight="600">4</text><rect x="70" y="224" width="230" height="36" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="100" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">3</text><text x="180" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A8AEB6" text-anchor="middle" font-weight="400">011</text><text x="270" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">6</text><rect x="70" y="260" width="230" height="36" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="100" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="middle" font-weight="600">4</text><text x="180" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3B4FB8" text-anchor="middle" font-weight="400">100</text><text x="270" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="70" y="296" width="230" height="36" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="100" y="319" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">5</text><text x="180" y="319" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A8AEB6" text-anchor="middle" font-weight="400">101</text><text x="270" y="319" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">3</text><rect x="70" y="332" width="230" height="36" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="100" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">6</text><text x="180" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A8AEB6" text-anchor="middle" font-weight="400">110</text><text x="270" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">5</text><rect x="70" y="368" width="230" height="36" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="100" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">7</text><text x="180" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A8AEB6" text-anchor="middle" font-weight="400">111</text><text x="270" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A8AEB6" text-anchor="middle" font-weight="400">7</text><text x="70" y="426" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#3B4FB8" text-anchor="start" font-weight="600">파란 줄 = 비트가 하나만 켜진 lane</text><path d="M318,230 L392,230" stroke="#5D6875" stroke-width="1.8" marker-end="url(#m)"/><text x="355" y="220" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="middle" font-weight="600">세 줄만</text><text x="420" y="100" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#182230" text-anchor="start" font-weight="600">② 기저는 그 세 줄이다</text><text x="420" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#B8651A" text-anchor="start" font-weight="600">bases[j]  =  OWN[ 2^j ]</text><rect x="420" y="160" width="330" height="30" fill="#F7EADC" stroke="#B8651A" stroke-width="1.3"/><text x="436" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B8651A" text-anchor="start" font-weight="400">j = 0   lane 1 = 001   →   bases[0] = 2</text><rect x="420" y="198" width="330" height="30" fill="#F7EADC" stroke="#B8651A" stroke-width="1.3"/><text x="436" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B8651A" text-anchor="start" font-weight="400">j = 1   lane 2 = 010   →   bases[1] = 4</text><rect x="420" y="236" width="330" height="30" fill="#F7EADC" stroke="#B8651A" stroke-width="1.3"/><text x="436" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B8651A" text-anchor="start" font-weight="400">j = 2   lane 4 = 100   →   bases[2] = 1</text><text x="420" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="start" font-weight="600">bases  =  [ 2, 4, 1 ]</text><text x="420" y="326" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">세 줄만 읽으면 나머지 다섯 줄은 계산된다.</text><text x="420" y="372" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2F7A55" text-anchor="start" font-weight="600">③ 나머지는 XOR 로 나온다</text><text x="420" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2F7A55" text-anchor="start" font-weight="400">lane 3 = 011   →   2 ^ 4        = 6</text><text x="700" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">OWN[3] = 6  ✓</text><text x="420" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2F7A55" text-anchor="start" font-weight="400">lane 5 = 101   →   2 ^ 1        = 3</text><text x="700" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">OWN[5] = 3  ✓</text><text x="420" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2F7A55" text-anchor="start" font-weight="400">lane 6 = 110   →   4 ^ 1        = 5</text><text x="700" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">OWN[6] = 5  ✓</text><text x="420" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2F7A55" text-anchor="start" font-weight="400">lane 7 = 111   →   2 ^ 4 ^ 1    = 7</text><text x="700" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5D6875" text-anchor="start" font-weight="400">OWN[7] = 7  ✓</text><rect x="40" y="494" width="820" height="38" fill="#FFFFFF" stroke="#C9CDD4"/><text x="60" y="518" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#182230" text-anchor="start" font-weight="600">32 lane 이라면 표 32줄 중 lane 1, 2, 4, 8, 16 다섯 줄만 읽으면 된다 — 선형이라 나머지가 따라오기 때문이다.</text></svg>