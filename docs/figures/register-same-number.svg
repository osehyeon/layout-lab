ll="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><rect x="654" y="320" width="38" height="32" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><rect x="692" y="320" width="38" height="32" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><rect x="730" y="320" width="38" height="32" fill="#FBE9E9" stroke="#B03A3A" stroke-width="1.6" stroke-dasharray='4 3'/><text x="749.0" y="340.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#B03A3A" text-anchor="middle" font-weight="600">v5</text><rect x="768" y="320" width="38" height="32" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><rect x="806" y="320" width="38" height="32" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.9"/><text x="490" y="378" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#182230" text-anchor="start" font-weight="600">이런 명령은 존재하지 않는다</text><text x="490" y="398" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#B03A3A" text-anchor="start" font-weight="400">레지스터 인덱스는 동적일 수 없다. 즉치뿐이다.</text><line x1="470" y1="80" x2="470" y2="440" stroke="#C9CDD4"/><text x="622" y="340" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="34" fill="#B03A3A" text-anchor="middle" font-weight="600">✗</text><rect x="40" y="452" width="820" height="52" fill="#FFFFFF" stroke="#C9CDD4"/><text x="60" y="476" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#182230" text-anchor="start" font-weight="600">그래서 배치는 “lane 마다 몇 번째 원소” 가 아니라 “모든 lane 의 k 번째 자리” 로만 적을 수 있다.</text><text x="60" y="496" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">LinearLayout 의 register 축이 lane 과 무관하게 공통인 이유이고, GMEM 의 coalescing 같은 개념이 없는 이유이기도 하다.</text></svg>