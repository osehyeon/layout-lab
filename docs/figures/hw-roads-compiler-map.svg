<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" role="img" aria-label="세 개의 가로 띠가 하드웨어의 세 길(register 재배열, shfl.sync, SMEM)을 나타내고, 시간이 흐르면서 register 축만 남는 변환은 2024-06 에 첫째 길로, lane 축까지 남는 변환은 2025-01 에 둘째 길로 내려오고, warp 축까지 남는 변환은 셋째 길에 남되 2026-09 부터 조건부로 둘째 길로 간다는 것을 보이는 시간표"><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8651A"/></marker></defs><rect x="0" y="0" width="900" height="582" fill="#FBFAF8"/><text x="40" y="34" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">하드웨어의 길은 그대로, 컴파일러의 지도가 생겼다</text><text x="40" y="56" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">가로 = 시간 · 세로 = 값을 lane 사이로 옮기는 세 길 (하드웨어, 변하지 않음) · 선 = 그 종류의 convert_layout 을 컴파일러가 어느 길로 보냈나</text><rect x="40" y="100.0" width="820" height="56" rx="4" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1"/><text x="50" y="122" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#3B4FB8" text-anchor="start" font-weight="600">① register 재배열</text><text x="50" y="139" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#3B4FB8" text-anchor="start" font-weight="400">같은 lane 안 · 명령 0개</text><rect x="40" y="178.0" width="820" height="56" rx="4" fill="#E4F0E9" stroke="#3E7D5A" stroke-width="1"/><text x="50" y="200" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#3E7D5A" text-anchor="start" font-weight="600">② shfl.sync</text><text x="50" y="217" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#3E7D5A" text-anchor="start" font-weight="400">워프 안 · 메모리 없음</text><rect x="40" y="256.0" width="820" height="56" rx="4" fill="#F7EADC" stroke="#B8651A" stroke-width="1"/><text x="50" y="278" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#B8651A" text-anchor="start" font-weight="600">③ SMEM + bar.sync</text><text x="50" y="295" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#B8651A" text-anchor="start" font-weight="400">워프 사이 · 메모리 필요</text><text x="28" y="206" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#5D6875" text-anchor="middle" font-weight="400" transform="rotate(-90 28 206)">하드웨어 — 세 길 모두 처음부터 있었다</text><rect x="200" y="100.0" width="74.97142857142859" height="212.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="200" y="100.0" width="74.97142857142859" height="212.0" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/><line x1="274.9714285714286" y1="92.0" x2="274.9714285714286" y2="320.0" stroke="#182230" stroke-width="1.4" stroke-dasharray="5 4"/><text x="268.9714285714286" y="88.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#5D6875" text-anchor="end" font-weight="400">지도 없음 — 전부 ③</text><text x="280.9714285714286" y="88.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#182230" text-anchor="start" font-weight="600">지도(LinearLayout) 도입 · 2024-05 #3794</text><polyline points="204,268 293.7142857142857,268 293.7142857142857,128 856,128" fill="none" stroke="#3B4FB8" stroke-width="2.4" stroke-linejoin="round"/><circle cx="293.7142857142857" cy="128" r="4" fill="#3B4FB8" stroke="#FFFFFF" stroke-width="1.2"/><text x="301.7142857142857" y="110" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#3B4FB8" text-anchor="start" font-weight="600">A  register 만 남는 변환 → ① 명령 0개</text><polyline points="204,284 424.9142857142857,284 424.9142857142857,206 856,206" fill="none" stroke="#3E7D5A" stroke-width="2.4" stroke-linejoin="round"/><circle cx="424.9142857142857" cy="206" r="4" fill="#3E7D5A" stroke="#FFFFFF" stroke-width="1.2"/><text x="432.9142857142857" y="188" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#3E7D5A" text-anchor="start" font-weight="600">C  lane 까지 남는 변환 → ② shfl.idx 한 번</text><circle cx="537.3714285714285" cy="206" r="3" fill="#3E7D5A" stroke="#FFFFFF" stroke-width="1.2"/><circle cx="556.1142857142856" cy="206" r="3" fill="#3E7D5A" stroke="#FFFFFF" stroke-width="1.2"/><text x="535.3714285714285" y="228" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" fill="#3E7D5A" text-anchor="start" font-weight="400">D E  알고리즘 개선</text><polyline points="204,300 799.7714285714286,300" fill="none" stroke="#B8651A" stroke-width="2.4" stroke-linejoin="round"/><polyline points="799.7714285714286,300 799.7714285714286,220 856,220" fill="none" stroke="#B8651A" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#o)"/><circle cx="799.7714285714286" cy="300" r="4" fill="#B8651A" stroke="#FFFFFF" stroke-width="1.2"/><text x="791.7714285714286" y="294" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#B8651A" text-anchor="end" font-weight="600">F  warp/block 까지 남는 변환 — 그대로 ③</text><text x="791.7714285714286" y="278" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" fill="#B8651A" text-anchor="end" font-weight="400">G  2026-09 부터 broadcast 복사본이 있을 때만 ② 로</text><circle cx="312.45714285714286" cy="284" r="3" fill="#5D6875" stroke="#FFFFFF" stroke-width="1.2"/><text x="318.45714285714286" y="295" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#5D6875" text-anchor="start" font-weight="400">B  ③ 자체도 지도로 계산</text><line x1="200" y1="334.0" x2="856" y2="334.0" stroke="#5D6875" stroke-width="1"/><line x1="200.0" y1="330.0" x2="200.0" y2="338.0" stroke="#5D6875" stroke-width="1"/><text x="204.0" y="348.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="start" font-weight="400">2024</text><line x1="424.9142857142857" y1="330.0" x2="424.9142857142857" y2="338.0" stroke="#5D6875" stroke-width="1"/><text x="428.9142857142857" y="348.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="start" font-weight="400">2025</text><line x1="649.8285714285714" y1="330.0" x2="649.8285714285714" y2="338.0" stroke="#5D6875" stroke-width="1"/><text x="653.8285714285714" y="348.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="start" font-weight="400">2026</text><line x1="293.7142857142857" y1="331.0" x2="293.7142857142857" y2="337.0" stroke="#182230" stroke-width="1"/><text x="293.7142857142857" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#182230" text-anchor="middle" font-weight="600">A</text><line x1="312.45714285714286" y1="331.0" x2="312.45714285714286" y2="337.0" stroke="#182230" stroke-width="1"/><text x="312.45714285714286" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#182230" text-anchor="middle" font-weight="600">B</text><line x1="424.9142857142857" y1="331.0" x2="424.9142857142857" y2="337.0" stroke="#182230" stroke-width="1"/><text x="424.9142857142857" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#182230" text-anchor="middle" font-weight="600">C</text><line x1="537.3714285714285" y1="331.0" x2="537.3714285714285" y2="337.0" stroke="#182230" stroke-width="1"/><text x="537.3714285714285" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#182230" text-anchor="middle" font-weight="600">D</text><line x1="556.1142857142856" y1="331.0" x2="556.1142857142856" y2="337.0" stroke="#182230" stroke-width="1"/><text x="556.1142857142856" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#182230" text-anchor="middle" font-weight="600">E</text><line x1="799.7714285714286" y1="331.0" x2="799.7714285714286" y2="337.0" stroke="#182230" stroke-width="1"/><text x="799.7714285714286" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#182230" text-anchor="middle" font-weight="600">F G</text><rect x="40" y="382.0" width="820" height="176" rx="3" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="52" y="400.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#182230" text-anchor="start" font-weight="600">이정표 — 전부 triton 저장소 커밋 제목·본문에서 확인</text><text x="52" y="422.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#3B4FB8" text-anchor="start" font-weight="600">A</text><text x="84" y="422.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">2024-06-13</text><text x="164" y="422.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">#4125</text><text x="290" y="422.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="400">Use LLs for register-to-register convert-layout ops — transferWithinThread, register 축만 남으면 명령 0개</text><text x="52" y="444.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="600">B</text><text x="84" y="444.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">2024-07-29</text><text x="164" y="444.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">#4383</text><text x="290" y="444.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="400">Using LinearLayout for distributed→distributed layout conversion — SMEM 경로의 주소 계산도 지도가 맡음</text><text x="52" y="466.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#3E7D5A" text-anchor="start" font-weight="600">C</text><text x="84" y="466.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">2025-01-15</text><text x="164" y="466.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">#5419</text><text x="290" y="466.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="400">Implement layout conversion within warps with shuffle idx — “a single index shuffle (mask + permute)”</text><text x="52" y="488.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="600">C′</text><text x="84" y="488.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">2025-01-10</text><text x="164" y="488.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">#5553</text><text x="290" y="488.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="400">Remove all layout conversion decomposition functions from the NVIDIA backend — 쌍마다 있던 옛 코드 제거</text><text x="52" y="510.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#3E7D5A" text-anchor="start" font-weight="600">D E</text><text x="84" y="510.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">2025-07/08</text><text x="164" y="510.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">#7558 #7809 #7810</text><text x="290" y="510.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="400">warp-local 알고리즘 개선(swap/ship), byte permute, warp.sync 활용</text><text x="52" y="532.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#B8651A" text-anchor="start" font-weight="600">F G</text><text x="84" y="532.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">2026-09-08</text><text x="164" y="532.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">#11646</text><text x="290" y="532.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#182230" text-anchor="start" font-weight="400">Allow warpshuffles when warp and block can read off broadcasted copies — ③ 의 일부가 조건부로 ② 로</text><text x="52" y="550.0" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#5D6875" text-anchor="start" font-weight="400">이 문서의 예 ([1,2,4,8,16] ↔ [4,8,16,1,2]) 는 lane 까지 남는 종류다 — 2025-01 부터 ② 로 갈 수 있고, 실제로는 이름이 생겨 변환 자체가 생기지 않는다.</text></svg>