<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" role="img" aria-label="lane 번호 21의 비트열에서 오른쪽 시프트는 상위 3비트를 나머지 연산은 하위 2비트를 꺼내고, XOR은 자리마다 비트를 뒤집을 뿐이라 어느 연산에도 자리올림이 없다는 것을 보이는 그림"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B4FB8"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8651A"/></marker></defs><rect x="0" y="0" width="900" height="538" fill="#FBFAF8"/><text x="40" y="34" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">하드웨어의 배치 계산은 비트를 꺼내고 XOR 하는 것뿐이다</text><text x="40" y="56" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">그래서 자리올림이 없고, F₂ 위에서 선형이 된다. 예로 lane 21 = 10101 을 쓴다.</text><text x="60" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#3B4FB8" text-anchor="start" font-weight="600">①  groupID = laneid >> 2</text><text x="60" y="122" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">상위 3비트를 꺼낸다</text><rect x="60" y="142" width="46" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="83.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><text x="83.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 4</text><rect x="106" y="142" width="46" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="129.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><text x="129.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 3</text><rect x="152" y="142" width="46" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="175.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><text x="175.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 2</text><rect x="198" y="142" width="46" height="44" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="221.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#AAB0B8" text-anchor="middle" font-weight="400">0</text><text x="221.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 1</text><rect x="244" y="142" width="46" height="44" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="267.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#AAB0B8" text-anchor="middle" font-weight="400">1</text><text x="267.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 0</text><path d="M175,192 L175,222" stroke="#3B4FB8" stroke-width="1.8" marker-end="url(#a)"/><rect x="106" y="230" width="46" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="129" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="152" y="230" width="46" height="44" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.6"/><text x="17