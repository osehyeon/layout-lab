ll="#AAB0B8" text-anchor="middle" font-weight="400">1</text><text x="605.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 2</text><rect x="628" y="142" width="46" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.6"/><text x="651.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">0</text><text x="651.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 1</text><rect x="674" y="142" width="46" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.6"/><text x="697.0" y="169.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">1</text><text x="697.0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">비트 0</text><path d="M605,192 L605,222" stroke="#B8651A" stroke-width="1.8" marker-end="url(#b)"/><rect x="582" y="230" width="46" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.6"/><text x="605" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">0</text><rect x="628" y="230" width="46" height="44" fill="#F7EADC" stroke="#B8651A" stroke-width="1.6"/><text x="651" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#B8651A" text-anchor="middle" font-weight="600">1</text><text x="605" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B8651A" text-anchor="middle" font-weight="600">01 = 1</text><text x="60" y="326" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">같은 비트열에 창만 다르게 낸 것이다. 어느 비트도 서로 섞이지 않는다 — 그래서 선형이다.</text><text x="60" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#182230" text-anchor="start" font-weight="600">③  smem = offset ^ (row × VEC)</text><text x="60" y="398" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">자리마다 따로 뒤집는다 — 여기도 올림이 없다</text><rect x="360" y="418" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="383.0" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="406" y="418" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="429.0" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="452" y="418" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="475.0" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="498" y="418" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="521.0" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="544" y="418" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="567.0" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">1</text><text x="340" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#182230" text-anchor="end" font-weight="400">offset 11</text><rect x="360" y="458" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="383.0" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="406" y="458" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="429.0" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="452" y="458" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="475.0" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="498" y="458" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="521.0" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="544" y="458" width="46" height="36" fill="#FFFFFF" stroke="#C9CDD4"/><text x="567.0" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="middle" font-weight="400">0</text><text x="340" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#182230" text-anchor="end" font-weight="400">^  row×VEC = 8</text><line x1="352" y1="500" x2="598" y2="500" stroke="#182230" stroke-width="1.4"/><rect x="360" y="504" width="46" height="36" fill="#F7EADC" stroke="#C9CDD4"/><text x="383.0" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B8651A" text-anchor="middle" font-weight="400">0</text><rect x="406" y="504" width="46" height="36" fill="#F7EADC" stroke="#C9CDD4"/><text x="429.0" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B8651A" text-anchor="middle" font-weight="400">0</text><rect x="452" y="504" width="46" height="36" fill="#F7EADC" stroke="#C9CDD4"/><text x="475.0" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B8651A" text-anchor="middle" font-weight="400">0</text><rect x="498" y="504" width="46" height="36" fill="#F7EADC" stroke="#C9CDD4"/><text x="521.0" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B8651A" text-anchor="middle" font-weight="400">1</text><rect x="544" y="504" width="46" height="36" fill="#F7EADC" stroke="#C9CDD4"/><text x="567.0" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B8651A" text-anchor="middle" font-weight="400">1</text><text x="340" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B8651A" text-anchor="end" font-weight="400">smem    = 3</text><rect x="403" y="415" width="52" height="133" fill="none" stroke="#B8651A" stroke-width="1.6" stroke-dasharray="4 3"/><text x="429.0" y="406" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#B8651A" text-anchor="middle" font-weight="600">이 자리만 뒤집힌다</text><text x="60" y="562" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">세 연산 모두 비트가 자기 자리에서만 움직인다. 정수 덧셈처럼 옆자리로 올림이 번지는 일이 없어서 F₂ 선형성이 성립한다.</text></svg>