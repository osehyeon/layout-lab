<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" role="img" aria-label="8비트 수 181에서 오른쪽 시프트 2로 하위 두 비트를 버리고 8로 나눈 나머지로 하위 세 비트만 남기면 원래의 비트 4 3 2가 꺼내진다는 것을 세 단계로 보이는 그림"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6875"/></marker></defs><rect x="0" y="0" width="900" height="506" fill="#FBFAF8"/><text x="40" y="34" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#182230" text-anchor="start" font-weight="600">(x >> a) % 2ᵇ  —  중간 비트를 꺼낸다</text><text x="40" y="56" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5D6875" text-anchor="start" font-weight="400">예)  x = 181 = 10110101 에서  (x >> 2) % 8  →  비트 2 부터 3개</text><text x="222.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 7</text><text x="274.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 6</text><text x="326.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 5</text><text x="378.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 4</text><text x="430.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 3</text><text x="482.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 2</text><text x="534.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 1</text><text x="586.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">비트 0</text><text x="180" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#182230" text-anchor="end" font-weight="600">x = 181</text><rect x="196" y="102" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="222.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="248" y="102" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="274.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="300" y="102" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="326.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="352" y="102" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="378.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="404" y="102" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="430.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="456" y="102" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="482.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="508" y="102" width="52" height="46" fill="#FFFFFF" stroke="#B8651A" stroke-width="1.8" stroke-dasharray="4 3"/><text x="534.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="400">0</text><rect x="560" y="102" width="52" height="46" fill="#FFFFFF" stroke="#B8651A" stroke-width="1.8" stroke-dasharray="4 3"/><text x="586.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8651A" text-anchor="middle" font-weight="400">1</text><text x="630" y="132" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">파란 칸이 꺼내려는 자리</text><path d="M404,152 L404,186" stroke="#5D6875" stroke-width="1.8" marker-end="url(#a)"/><text x="418" y="174" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">>> 2   — 오른쪽으로 두 칸 민다. 주황 두 칸은 버려진다.</text><text x="180" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#182230" text-anchor="end" font-weight="600">x >> 2 = 45</text><rect x="196" y="194" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="222.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="248" y="194" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="274.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="300" y="194" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="326.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="352" y="194" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="378.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">0</text><rect x="404" y="194" width="52" height="46" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="430.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#182230" text-anchor="middle" font-weight="400">1</text><rect x="456" y="194" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="482.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="508" y="194" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="534.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="560" y="194" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="586.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><text x="630" y="224" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">꺼낼 자리가 맨 아래로 내려왔다</text><path d="M404,244 L404,278" stroke="#5D6875" stroke-width="1.8" marker-end="url(#a)"/><text x="418" y="266" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">% 8   =  &amp; 00000111   — 하위 3비트만 남긴다</text><text x="180" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#182230" text-anchor="end" font-weight="600">%  8 =  5</text><rect x="196" y="286" width="52" height="46" fill="#F4F4F2" stroke="#C9CDD4" stroke-width="1"/><text x="222.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#AAB0B8" text-anchor="middle" font-weight="400">0</text><rect x="248" y="286" width="52" height="46" fill="#F4F4F2" stroke="#C9CDD4" stroke-width="1"/><text x="274.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#AAB0B8" text-anchor="middle" font-weight="400">0</text><rect x="300" y="286" width="52" height="46" fill="#F4F4F2" stroke="#C9CDD4" stroke-width="1"/><text x="326.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#AAB0B8" text-anchor="middle" font-weight="400">0</text><rect x="352" y="286" width="52" height="46" fill="#F4F4F2" stroke="#C9CDD4" stroke-width="1"/><text x="378.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#AAB0B8" text-anchor="middle" font-weight="400">0</text><rect x="404" y="286" width="52" height="46" fill="#F4F4F2" stroke="#C9CDD4" stroke-width="1"/><text x="430.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#AAB0B8" text-anchor="middle" font-weight="400">0</text><rect x="456" y="286" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="482.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><rect x="508" y="286" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="534.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">0</text><rect x="560" y="286" width="52" height="46" fill="#E7EAF9" stroke="#3B4FB8" stroke-width="1.8"/><text x="586.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B4FB8" text-anchor="middle" font-weight="600">1</text><text x="630" y="316" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">결과 = 원래의 비트 4, 3, 2</text><rect x="40" y="368" width="820" height="104" fill="#FFFFFF" stroke="#C9CDD4"/><text x="60" y="396" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#182230" text-anchor="start" font-weight="600">(x >> a) % 2ᵇ     =     비트 a 부터 b 개</text><text x="60" y="424" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">a 가 창의 시작 위치, b 가 창의 폭이다.  a = 0 이면 하위 b 비트, b 가 전체 폭이면 상위만 남기는 >> 와 같다.</text><text x="60" y="450" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#B8651A" text-anchor="start" font-weight="400">단서 — 2의 거듭제곱일 때만 창 내기가 된다.  21 % 4 = 1 (하위 2비트) 이지만  21 % 3 = 0 은 비트로 설명되지 않는다.</text></svg>