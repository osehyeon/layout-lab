<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" role="img" aria-label="기저가 1 2 4 에서 4 1 2 로, 다시 2 4 1 로 갔다가 세 번째에 1 2 4 로 돌아오는 3-사이클 그림"><rect x="0" y="0" width="900" height="344" fill="#FBFAF8"/><defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#182230"/></marker><marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8651A"/></marker></defs><text x="40" y="30" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#182230" text-anchor="start" font-weight="600">세 번 돌리면 제자리 — f³ = I</text><text x="40" y="52" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" fill="#5D6875" text-anchor="start" font-weight="400">같은 연산을 반복하면 기저가 순환한다. 세 회차째의 변환 C 는 항등이고, 낼 명령이 0개다.</text><rect x="40" y="110" width="170" height="84" rx="4" fill="#FFFFFF" stroke="#D5CFC4" stroke-width="1"/><text x="52" y="132" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="600">0회 · 출발</text><text x="52" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="start" font-weight="600">layout [1, 2, 4]</text><text x="52" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">배열 0 1 2 3 4 5 6 7</text><rect x="252" y="110" width="170" height="84" rx="4" fill="#FFFFFF" stroke="#D5CFC4" stroke-width="1"/><text x="264" y="132" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="600">1회 · 결과기저(1)</text><text x="264" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="start" font-weight="600">layout [2, 4, 1]</text><text x="264" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">배열 0 4 1 5 2 6 3 7</text><rect x="464" y="110" width="170" height="84" rx="4" fill="#FFFFFF" stroke="#D5CFC4" stroke-width="1"/><text x="476" y="132" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#5D6875" text-anchor="start" font-weight="600">2회 · 결과기저(2)</text><text x="476" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3B4FB8" text-anchor="start" font-weight="600">layout [4, 1, 2]</text><text x="476" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">배열 0 2 4 6 1 3 5 7</text><rect x="676" y="110" width="170" height="84" rx="4" fill="#FDEBD8" stroke="#B8651A" stroke-width="1.8"/><text x="688" y="132" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#B8651A" text-anchor="start" font-weight="600">3회 · 제자리</text><text x="688" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B8651A" text-anchor="start" font-weight="600">layout [1, 2, 4]</text><text x="688" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">배열 0 1 2 3 4 5 6 7</text><line x1="218" y1="152.0" x2="243" y2="152.0" stroke="#182230" stroke-width="1.6" marker-end="url(#c1)"/><text x="230.5" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#182230" text-anchor="middle" font-weight="600">f</text><line x1="430" y1="152.0" x2="455" y2="152.0" stroke="#182230" stroke-width="1.6" marker-end="url(#c1)"/><text x="442.5" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#182230" text-anchor="middle" font-weight="600">f</text><line x1="642" y1="152.0" x2="667" y2="152.0" stroke="#182230" stroke-width="1.6" marker-end="url(#c1)"/><text x="654.5" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#182230" text-anchor="middle" font-weight="600">f</text><text x="231.0" y="202" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" fill="#5D6875" text-anchor="middle" font-weight="400">reshape(2,4) → .T → reshape(8)</text><path d="M 761.0 228 Q 443.0 300 125.0 228" fill="none" stroke="#B8651A" stroke-width="2.2" marker-end="url(#c2)"/><rect x="278.0" y="252" width="330" height="36" rx="4" fill="#FBFAF8"/><text x="443.0" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#B8651A" text-anchor="middle" font-weight="600">f³ = I   —   같은 배치로 돌아왔다</text><text x="443.0" y="283" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" fill="#5D6875" text-anchor="middle" font-weight="400">그래서 C = B⁻¹A = [1, 2, 4] 이고, 옮길 값이 하나도 없다</text><rect x="40" y="300" width="820" height="34" rx="5" fill="#FFFFFF" stroke="#D5CFC4" stroke-width="1"/><text x="56" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#182230" text-anchor="start" font-weight="600">GMEM</text><text x="112" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5D6875" text-anchor="start" font-weight="400">회차마다 새 버퍼로 8칸 복사  →  3회면 복사 3번</text><text x="470" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#B8651A" text-anchor="start" font-weight="600">레지스터</text><text x="536" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#B8651A" text-anchor="start" font-weight="400">기저만 갈아 끼운다  →  3회면 복사 0번, 명령 0개</text></svg>