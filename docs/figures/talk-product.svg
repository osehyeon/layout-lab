-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">reg</text><text x="736.0" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="middle" font-weight="400">thr</text><text x="662" y="246.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="end" font-weight="400">L₁</text><text x="662" y="286.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5D6875" text-anchor="end" font-weight="400">L₂</text><rect x="670" y="222" width="22" height="20" rx="0" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.8"/><text x="681.0" y="235.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#182230" text-anchor="middle" font-weight="700">1</text><rect x="692" y="222" width="22" height="20" rx="0" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.8"/><text x="703.0" y="235.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#A8AEB6" text-anchor="middle" font-weight="400">0</text><rect x="714" y="222" width="22" height="20" rx="0" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.8"/><text x="725.0" y="235.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#A8AEB6" text-anchor="middle" font-weight="400">0</text><rect x="736" y="222" width="22" height="20" rx="0" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.8"/><text x="747.0" y="235.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#A8AEB6" text-anchor="middle" font-weight="400">0</text><rect x="670" y="242" width="22" height="20" rx="0" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="0.8"/><text x="681.0" y="255.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#A8AEB6" text-anchor="middle" font-weight="400">0</text><rect x="692" y="242" width="22" height="20" rx="0" fill="#